<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8"/>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        html,body{
        margin:0;
        padding:0;
        height:100%;
        }

        #map{
        height:100%;
        width:100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    var map = L.map('map', {
    preferCanvas: true,
    zoomAnimation:false,
    fadeAnimation:false,
    markerZoomAnimation:false
    }).setView([-22.252, -45.703], 13);

    L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
    maxZoom:19
    }).addTo(map);

    setTimeout(function(){
    map.invalidateSize();
    },200);

</script>

</body>
</html>
