<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8"/>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        html,body{
            margin:0;
            padding:0;
            height:100%;
        }

        #map{
            width:100%;
            height:100%;
        }

        .priority-legend {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,.25);
            color: #334155;
            font: 13px Arial, sans-serif;
            line-height: 22px;
        }

        .priority-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-right: 7px;
            border-radius: 50%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    let selectedMarker = null;
    let selectionEnabled = false;

    const map = L.map("map",{

        preferCanvas:true,
        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false

    }).setView([-22.252,-45.703],13);

    const tileLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        updateWhenIdle:true,
        keepBuffer:2,
        attribution:'&copy; OpenStreetMap'
    });

    tileLayer.addTo(map);

    map.on("click",function(e){

        if(!selectionEnabled){
            return;
        }

        if(selectedMarker){

            map.removeLayer(selectedMarker);
        }

        selectedMarker = L.marker(e.latlng).addTo(map);

        if(window.javaBridge){

            window.javaBridge.onLocationSelected(
                e.latlng.lat,
                e.latlng.lng
            );
        }
    });

    function setSelectionEnabled(enabled){
        selectionEnabled = enabled;
        map.getContainer().style.cursor = enabled ? "crosshair" : "";
    }

    function centerMap(lat,lng){

        map.setView([lat,lng],17);
    }

    function addComplaintMarker(lat,lng,title,priority){

        const colors = {
            BAIXA: "#64748B",
            MEDIA: "#2563EB",
            ALTA: "#EA580C",
            URGENTE: "#DC2626"
        };

        const color = colors[priority] || "#2563EB";

        L.circleMarker([lat,lng], {
            radius: 9,
            color: "#FFFFFF",
            weight: 2,
            fillColor: color,
            fillOpacity: 0.95
        })
            .addTo(map)
            .bindPopup(title);
    }

    function showPriorityLegend(){

        const legend = L.control({position: "bottomright"});

        legend.onAdd = function(){
            const div = L.DomUtil.create("div", "priority-legend");
            div.innerHTML =
                "<b>Prioridade</b><br>" +
                '<span class="priority-dot" style="background:#64748B"></span>Baixa<br>' +
                '<span class="priority-dot" style="background:#2563EB"></span>Média<br>' +
                '<span class="priority-dot" style="background:#EA580C"></span>Alta<br>' +
                '<span class="priority-dot" style="background:#DC2626"></span>Urgente';
            return div;
        };

        legend.addTo(map);
    }

    let loadingPopup = null;

    function showLoading(){

        if(loadingPopup){

            map.removeLayer(loadingPopup);

        }

        loadingPopup = L.popup({

            closeButton:false,
            autoClose:false

        })
        .setLatLng(map.getCenter())
        .setContent("Buscando endereço...")
        .openOn(map);

    }

    function hideLoading(){

        if(loadingPopup){

            map.closePopup(loadingPopup);

            loadingPopup = null;

        }

    }

    function invalidateMapSize(){
        map._sizeChanged = true;
        map.invalidateSize({pan: false, animate: false});
    }

    window.addEventListener("resize", invalidateMapSize);

    setTimeout(invalidateMapSize, 200);

</script>

</body>

</html>
