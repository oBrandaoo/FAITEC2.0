<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8"/>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!--
        O WebView do JavaFX no Windows pode aplicar a escala HiDPI duas vezes nas
        transformacoes 3D do Leaflet. Isso desloca e recorta somente os tiles do
        mapa. A flag precisa existir antes do carregamento da biblioteca.
    -->
    <script>window.L_DISABLE_3D = true;</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        html,body{
            margin:0;
            padding:0;
            height:100%;
        }

        #map{
            width:100%;
            height:100%;
        }

        .heatmap-layer {
            position: absolute;
            inset: 0;
            z-index: 420;
            pointer-events: none;
        }

        .priority-legend {
            background: white;
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,.25);
            color: #334155;
            font: 13px Arial, sans-serif;
            line-height: 22px;
            min-width: 145px;
        }

        .legend-section-title {
            margin: 6px 0 2px;
            font-weight: 700;
        }

        .status-legend-mark,
        .status-marker-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
        }

        .status-legend-mark {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            font-size: 10px;
            vertical-align: middle;
        }

        .status-marker-badge {
            width: 15px;
            height: 15px;
            margin-left: -7px;
            margin-right: 2px;
            border: 1px solid white;
            font: bold 9px Arial, sans-serif;
        }

        .status-pendente { background: #64748B; }
        .status-em-analise { background: #7C3AED; }
        .status-em-execucao { background: #D97706; }
        .status-resolvido { background: #16A34A; }
        .status-cancelado { background: #334155; }

        .map-filter-panel {
            width: 238px;
            max-height: calc(100vh - 36px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            background: rgba(255, 255, 255, .97);
            box-shadow: 0 8px 24px rgba(15, 23, 42, .18);
            color: #0F172A;
            font: 13px Arial, sans-serif;
        }

        .map-filter-title {
            margin-bottom: 11px;
            color: #0F172A;
            font-size: 14px;
            font-weight: 700;
        }

        .map-filter-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 9px;
        }

        .map-filter-row label {
            color: #475569;
            font-size: 11px;
            font-weight: 700;
        }

        .map-filter-row select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            background: #FFFFFF;
            color: #0F172A;
            font: 13px Arial, sans-serif;
            outline: none;
        }

        .map-filter-row input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 8px;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            background: white;
            color: #0F172A;
            font: 12px Arial, sans-serif;
        }

        .map-date-range {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px;
        }

        .map-date-range.is-visible {
            display: grid;
        }

        .map-date-field label {
            display: block;
            margin-bottom: 4px;
            color: #64748B;
            font-size: 10px;
        }

        .map-filter-row select:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
        }

        .map-view-panel {
            width: 238px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            background: rgba(255, 255, 255, .97);
            box-shadow: 0 6px 20px rgba(15, 23, 42, .2);
            color: #0F172A;
            font: 13px Arial, sans-serif;
        }

        .map-view-title {
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 700;
        }

        .map-view-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .map-view-button {
            min-height: 34px;
            padding: 6px 7px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            background: #FFFFFF;
            color: #334155;
            cursor: pointer;
            font: 12px Arial, sans-serif;
        }

        .map-view-button:hover {
            border-color: #2563EB;
            color: #1D4ED8;
        }

        .map-view-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .18);
        }

        .map-view-button.is-active {
            border-color: #2563EB;
            background: #DBEAFE;
            color: #1D4ED8;
            font-weight: 700;
        }

        .map-view-button-wide {
            grid-column: 1 / -1;
        }

        .map-view-button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .map-view-button.is-active[data-toggle] {
            border-color: #0F766E;
            background: #CCFBF1;
            color: #115E59;
        }

        .map-view-status {
            min-height: 15px;
            margin-top: 7px;
            color: #64748B;
            font-size: 11px;
            line-height: 15px;
        }

        .area-summary-circle {
            fill: rgba(14, 116, 144, .12);
            stroke: #0E7490;
            stroke-width: 2;
            stroke-dasharray: 7 5;
        }

        .area-summary-popup {
            white-space: pre-line;
            color: #334155;
            font: 12px/1.55 Arial, sans-serif;
        }

        @media (max-width: 520px) {
            .map-filter-panel {
                width: 190px;
                padding: 11px;
            }
        }

        .priority-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-right: 7px;
            border-radius: 50%;
        }

        .complaint-marker-icon {
            background: transparent;
            border: 0;
        }

        .complaint-marker-wrap {
            display: flex;
            align-items: center;
            gap: 3px;
            width: max-content;
            filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .35));
        }

        .complaint-marker-dot {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .complaint-marker-count {
            min-width: 18px;
            padding: 2px 5px;
            border: 1px solid #CBD5E1;
            border-radius: 11px;
            background: #FFFFFF;
            color: #0F172A;
            text-align: center;
            font: bold 12px Arial, sans-serif;
            line-height: 16px;
            box-sizing: border-box;
        }

        .community-confirmation {
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px solid #E2E8F0;
            color: #475569;
            font: 12px Arial, sans-serif;
        }

        .community-confirmation button {
            width: 100%;
            margin-bottom: 5px;
            padding: 8px 10px;
            border: 1px solid #15803D;
            border-radius: 7px;
            background: #16A34A;
            color: #FFFFFF;
            cursor: pointer;
            font: bold 12px Arial, sans-serif;
        }

        .community-confirmation button:hover:not(:disabled) {
            background: #15803D;
        }

        .community-confirmation button:disabled {
            border-color: #CBD5E1;
            background: #E2E8F0;
            color: #475569;
            cursor: default;
        }

        .community-confirmation-status {
            color: #166534;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    let selectedMarker = null;
    let selectionEnabled = false;

    const map = L.map("map",{

        preferCanvas:true,
        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false

    }).setView([-22.252,-45.703],13);

    const complaintMarkers = L.layerGroup().addTo(map);
    const AREA_SUMMARY_RADIUS_METERS = 500;
    let heatPoints = [];
    let heatmapEnabled = false;
    let heatmapCanvas = null;
    let areaSummaryEnabled = false;
    let areaSummaryCircle = null;
    let areaSummaryPopup = null;
    let userLocationMarker = null;

    const streetTileLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        updateWhenIdle:true,
        keepBuffer:2,
        attribution:'&copy; OpenStreetMap'
    });

    const satelliteTileLayer = L.tileLayer(
        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom:19,
        updateWhenIdle:true,
        keepBuffer:2,
        attribution:'Tiles &copy; Esri'
    });

    let activeBaseLayer = streetTileLayer;
    let activeMapStyle = "street";
    streetTileLayer.addTo(map);

    let mapViewControl = null;
    let cityBoundaryLayer = null;

    function initializeMapViewControls(){
        if(mapViewControl){
            return;
        }

        mapViewControl = L.control({position: "topleft"});
        mapViewControl.onAdd = function(){
            const panel = L.DomUtil.create("div", "map-view-panel");
            panel.setAttribute("aria-label", "Controles de visualização do mapa");
            panel.innerHTML =
                '<div class="map-view-title">Visualização</div>' +
                '<div class="map-view-actions">' +
                    '<button type="button" class="map-view-button is-active" data-map-style="street" aria-pressed="true">Mapa</button>' +
                    '<button type="button" class="map-view-button" data-map-style="satellite" aria-pressed="false">Satélite</button>' +
                    '<button type="button" id="city-boundary-button" class="map-view-button map-view-button-wide" aria-pressed="false">Limites da cidade</button>' +
                    '<button type="button" id="heatmap-button" class="map-view-button" data-toggle aria-pressed="false">Mapa de calor</button>' +
                    '<button type="button" id="my-location-button" class="map-view-button">Minha localização</button>' +
                    '<button type="button" id="area-summary-button" class="map-view-button map-view-button-wide" data-toggle aria-pressed="false">Resumo desta área</button>' +
                '</div>' +
                '<div id="map-view-status" class="map-view-status" aria-live="polite"></div>';

            L.DomEvent.disableClickPropagation(panel);
            L.DomEvent.disableScrollPropagation(panel);
            return panel;
        };
        mapViewControl.addTo(map);
        initializeHeatmapCanvas();

        document.querySelectorAll("[data-map-style]").forEach(function(button){
            button.addEventListener("click", function(){
                setMapStyle(button.getAttribute("data-map-style"));
            });
        });
        document.getElementById("city-boundary-button")
            .addEventListener("click", toggleCityBoundary);
        document.getElementById("heatmap-button")
            .addEventListener("click", toggleHeatmap);
        document.getElementById("my-location-button")
            .addEventListener("click", centerOnMyLocation);
        document.getElementById("area-summary-button")
            .addEventListener("click", toggleAreaSummary);
    }

    function setMapStyle(style){
        const nextLayer = style === "satellite" ? satelliteTileLayer : streetTileLayer;
        if(activeBaseLayer !== nextLayer){
            map.removeLayer(activeBaseLayer);
            nextLayer.addTo(map);
            activeBaseLayer = nextLayer;
        }

        activeMapStyle = style;
        document.querySelectorAll("[data-map-style]").forEach(function(button){
            const active = button.getAttribute("data-map-style") === activeMapStyle;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", active ? "true" : "false");
        });
    }

    function initializeHeatmapCanvas(){
        if (heatmapCanvas) {
            return;
        }
        heatmapCanvas = document.createElement('canvas');
        heatmapCanvas.className = 'heatmap-layer';
        map.getContainer().appendChild(heatmapCanvas);
        map.on('moveend zoomend resize', renderHeatmap);
        renderHeatmap();
    }

    function setHeatPoints(points){
        heatPoints = Array.isArray(points) ? points : [];
        renderHeatmap();
    }

    function renderHeatmap(){
        if (!heatmapCanvas) {
            return;
        }
        const size = map.getSize();
        const ratio = window.devicePixelRatio || 1;
        heatmapCanvas.width = Math.round(size.x * ratio);
        heatmapCanvas.height = Math.round(size.y * ratio);
        heatmapCanvas.style.width = size.x + 'px';
        heatmapCanvas.style.height = size.y + 'px';
        const context = heatmapCanvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, size.x, size.y);
        if (!heatmapEnabled) {
            return;
        }

        heatPoints.forEach(function(coordinates){
            const point = map.latLngToContainerPoint(coordinates);
            if (point.x < -70 || point.y < -70 || point.x > size.x + 70 || point.y > size.y + 70) {
                return;
            }
            const radius = 58;
            const gradient = context.createRadialGradient(
                point.x, point.y, 2, point.x, point.y, radius);
            gradient.addColorStop(0, 'rgba(220, 38, 38, 0.42)');
            gradient.addColorStop(0.28, 'rgba(249, 115, 22, 0.30)');
            gradient.addColorStop(0.62, 'rgba(250, 204, 21, 0.16)');
            gradient.addColorStop(1, 'rgba(250, 204, 21, 0)');
            context.fillStyle = gradient;
            context.fillRect(point.x - radius, point.y - radius, radius * 2, radius * 2);
        });
    }

    function toggleHeatmap(){
        heatmapEnabled = !heatmapEnabled;
        const button = document.getElementById('heatmap-button');
        button.classList.toggle('is-active', heatmapEnabled);
        button.setAttribute('aria-pressed', String(heatmapEnabled));
        renderHeatmap();
        setMapViewStatus(heatmapEnabled
            ? 'Mapa de calor ligado; os filtros atuais são aplicados.'
            : 'Mapa de calor desligado.');
    }

    function centerOnMyLocation(){
        const button = document.getElementById('my-location-button');
        if (!navigator.geolocation) {
            setMapViewStatus('Localização não disponível neste dispositivo.');
            return;
        }
        button.disabled = true;
        setMapViewStatus('Buscando sua localização…');
        navigator.geolocation.getCurrentPosition(function(position){
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            map.setView([latitude, longitude], 16);
            if (userLocationMarker) {
                map.removeLayer(userLocationMarker);
            }
            userLocationMarker = L.circleMarker([latitude, longitude], {
                radius: 8,
                color: '#FFFFFF',
                weight: 3,
                fillColor: '#0E7490',
                fillOpacity: 1
            }).addTo(map).bindPopup('Você está aqui.');
            userLocationMarker.openPopup();
            button.disabled = false;
            setMapViewStatus('Mapa centralizado na sua localização.');
        }, function(error){
            button.disabled = false;
            const message = error.code === 1
                ? 'Permita o acesso à localização para usar este recurso.'
                : 'Não foi possível obter sua localização neste dispositivo.';
            setMapViewStatus(message);
        }, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000});
    }

    function toggleAreaSummary(){
        areaSummaryEnabled = !areaSummaryEnabled;
        const button = document.getElementById('area-summary-button');
        button.classList.toggle('is-active', areaSummaryEnabled);
        button.setAttribute('aria-pressed', String(areaSummaryEnabled));
        map.getContainer().style.cursor = areaSummaryEnabled ? 'crosshair' : '';
        if (!areaSummaryEnabled) {
            clearAreaSummary();
        }
        setMapViewStatus(areaSummaryEnabled
            ? 'Clique no mapa para resumir as reclamações em um raio de 500 m.'
            : 'Resumo da área removido.');
    }

    function setMapViewStatus(message){
        const status = document.getElementById('map-view-status');
        if (status) {
            status.textContent = message;
        }
    }

    function showAreaSummary(latitude, longitude, radiusMeters, summary){
        const center = L.latLng(latitude, longitude);
        clearAreaSummary();
        areaSummaryCircle = L.circle(center, {
            radius: radiusMeters,
            className: 'area-summary-circle',
            interactive: false
        }).addTo(map);
        const content = document.createElement('div');
        content.className = 'area-summary-popup';
        content.textContent = summary;
        areaSummaryPopup = L.popup({maxWidth: 300})
            .setLatLng(center)
            .setContent(content)
            .openOn(map);
    }

    function clearAreaSummary(){
        if (areaSummaryCircle && map.hasLayer(areaSummaryCircle)) {
            map.removeLayer(areaSummaryCircle);
        }
        if (areaSummaryPopup) {
            map.closePopup(areaSummaryPopup);
        }
        areaSummaryCircle = null;
        areaSummaryPopup = null;
    }

    function toggleCityBoundary(){
        const button = document.getElementById("city-boundary-button");
        const status = document.getElementById("map-view-status");

        if(cityBoundaryLayer){
            if(map.hasLayer(cityBoundaryLayer)){
                map.removeLayer(cityBoundaryLayer);
                button.classList.remove("is-active");
                button.setAttribute("aria-pressed", "false");
                status.textContent = "Limites ocultos.";
            }else{
                cityBoundaryLayer.addTo(map);
                focusCityBoundary();
                button.classList.add("is-active");
                button.setAttribute("aria-pressed", "true");
                status.textContent = "Limites de Santa Rita do Sapucaí.";
            }
            return;
        }

        button.disabled = true;
        status.textContent = "Carregando limites da cidade...";
        if(window.javaBridge){
            window.javaBridge.onCityBoundaryRequested();
        }else{
            showCityBoundaryError("Integração com o mapa indisponível.");
        }
    }

    function showCityBoundary(geoJson){
        try{
            const geometry = typeof geoJson === "string" ? JSON.parse(geoJson) : geoJson;
            cityBoundaryLayer = L.geoJSON(geometry, {
                style: {
                    color: "#7C3AED",
                    weight: 4,
                    opacity: .95,
                    fillColor: "#8B5CF6",
                    fillOpacity: .07
                }
            }).addTo(map);
            cityBoundaryLayer.bindTooltip("Limites de Santa Rita do Sapucaí", {
                sticky: true
            });
            focusCityBoundary();

            const button = document.getElementById("city-boundary-button");
            button.disabled = false;
            button.classList.add("is-active");
            button.setAttribute("aria-pressed", "true");
            document.getElementById("map-view-status").textContent =
                "Limites de Santa Rita do Sapucaí.";
        }catch(error){
            showCityBoundaryError("Não foi possível exibir os limites da cidade.");
        }
    }

    function focusCityBoundary(){
        if(cityBoundaryLayer && cityBoundaryLayer.getBounds().isValid()){
            map.fitBounds(cityBoundaryLayer.getBounds(), {
                padding: [24, 24],
                maxZoom: 13
            });
        }
    }

    function showCityBoundaryError(message){
        const button = document.getElementById("city-boundary-button");
        if(button){
            button.disabled = false;
        }
        const status = document.getElementById("map-view-status");
        if(status){
            status.textContent = message || "Não foi possível carregar os limites da cidade.";
        }
    }

    let mapFilterControl = null;

    function initializeMapFilters(){
        if(mapFilterControl){
            return;
        }

        mapFilterControl = L.control({position: "topright"});
        mapFilterControl.onAdd = function(){
            const panel = L.DomUtil.create("div", "map-filter-panel");
            panel.setAttribute("aria-label", "Filtros do mapa");
            panel.innerHTML =
                '<div class="map-filter-title">Filtrar reclamações</div>' +
                '<div class="map-filter-row">' +
                    '<label for="map-scope-filter">Exibir</label>' +
                    '<select id="map-scope-filter" aria-label="Exibir todas ou minhas reclamações">' +
                        '<option value="all">Todas</option>' +
                        '<option value="mine">Minhas</option>' +
                    '</select>' +
                '</div>' +
                '<div class="map-filter-row">' +
                    '<label for="map-priority-filter">Prioridade</label>' +
                    '<select id="map-priority-filter" aria-label="Filtrar por prioridade">' +
                        '<option value="ALL">Todas</option>' +
                        '<option value="BAIXA">Baixa</option>' +
                        '<option value="MEDIA">Média</option>' +
                        '<option value="ALTA">Alta</option>' +
                        '<option value="URGENTE">Urgente</option>' +
                    '</select>' +
                '</div>';
            panel.innerHTML +=
                '<div class="map-filter-row">' +
                    '<label for="map-status-filter">Situação</label>' +
                    '<select id="map-status-filter" aria-label="Filtrar por situação">' +
                        '<option value="ALL">Todas</option>' +
                        '<option value="PENDENTE">Pendente</option>' +
                        '<option value="EM_ANALISE">Em análise</option>' +
                        '<option value="EM_EXECUCAO">Em execução</option>' +
                        '<option value="RESOLVIDO">Resolvido</option>' +
                        '<option value="CANCELADO">Cancelado</option>' +
                    '</select>' +
                '</div>' +
                '<div class="map-filter-row">' +
                    '<label for="map-period-filter">Período</label>' +
                    '<select id="map-period-filter" aria-label="Filtrar por período">' +
                        '<option value="ALL">Todo o período</option>' +
                        '<option value="7">Últimos 7 dias</option>' +
                        '<option value="30">Últimos 30 dias</option>' +
                        '<option value="90">Últimos 90 dias</option>' +
                        '<option value="CUSTOM">Personalizado</option>' +
                    '</select>' +
                '</div>' +
                '<div id="map-date-range" class="map-date-range">' +
                    '<div class="map-date-field"><label for="map-start-date">De</label>' +
                        '<input id="map-start-date" type="date" aria-label="Data inicial"></div>' +
                    '<div class="map-date-field"><label for="map-end-date">Até</label>' +
                        '<input id="map-end-date" type="date" aria-label="Data final"></div>' +
                '</div>';

            L.DomEvent.disableClickPropagation(panel);
            L.DomEvent.disableScrollPropagation(panel);
            return panel;
        };
        mapFilterControl.addTo(map);

        const scopeFilter = document.getElementById("map-scope-filter");
        const priorityFilter = document.getElementById("map-priority-filter");
        const statusFilter = document.getElementById("map-status-filter");
        const periodFilter = document.getElementById("map-period-filter");
        const startDate = document.getElementById("map-start-date");
        const endDate = document.getElementById("map-end-date");
        const dateRange = document.getElementById("map-date-range");
        const updateCustomDateVisibility = function(){
            dateRange.classList.toggle("is-visible", periodFilter.value === "CUSTOM");
        };
        const notifyFilterChange = function(){
            if(window.javaBridge){
                window.javaBridge.onMapFiltersChanged(scopeFilter.value, priorityFilter.value,
                    statusFilter.value, periodFilter.value, startDate.value, endDate.value);
            }
        };
        scopeFilter.addEventListener("change", notifyFilterChange);
        priorityFilter.addEventListener("change", notifyFilterChange);
        statusFilter.addEventListener("change", notifyFilterChange);
        periodFilter.addEventListener("change", function(){
            updateCustomDateVisibility();
            notifyFilterChange();
        });
        startDate.addEventListener("change", notifyFilterChange);
        endDate.addEventListener("change", notifyFilterChange);
    }

    function setMapFiltersVisible(visible){
        if(mapFilterControl && mapFilterControl.getContainer()){
            mapFilterControl.getContainer().style.display = visible ? "" : "none";
        }
    }

    map.on("click",function(e){
        if(selectionEnabled){
            if(selectedMarker){
                map.removeLayer(selectedMarker);
            }
            selectedMarker = L.marker(e.latlng).addTo(map);
            if(window.javaBridge){
                window.javaBridge.onLocationSelected(e.latlng.lat, e.latlng.lng);
            }
            return;
        }

        if(areaSummaryEnabled){
            if(window.javaBridge){
                window.javaBridge.onAreaSummarySelected(
                    e.latlng.lat, e.latlng.lng, AREA_SUMMARY_RADIUS_METERS);
            }
        }
    });

    function setSelectionEnabled(enabled){
        selectionEnabled = enabled;
        map.getContainer().style.cursor = enabled ? "crosshair" : "";
        const areaButton = document.getElementById('area-summary-button');
        if (areaButton) {
            areaButton.disabled = enabled;
            if (enabled && areaSummaryEnabled) {
                areaSummaryEnabled = false;
                areaButton.classList.remove('is-active');
                areaButton.setAttribute('aria-pressed', 'false');
                clearAreaSummary();
            }
        }
    }

    function centerMap(lat,lng){

        map.setView([lat,lng],17);
    }

    function addComplaintMarker(lat,lng,title,priority,count,complaintId,confirmations,hasConfirmed,status,requiredConfirmations){

        const colors = {
            BAIXA: "#64748B",
            MEDIA: "#2563EB",
            ALTA: "#EA580C",
            URGENTE: "#DC2626"
        };
        const statusMetadata = {
            PENDENTE: {symbol: '!', className: 'pendente'},
            EM_ANALISE: {symbol: '?', className: 'em-analise'},
            EM_EXECUCAO: {symbol: '↗', className: 'em-execucao'},
            RESOLVIDO: {symbol: '✓', className: 'resolvido'},
            CANCELADO: {symbol: '×', className: 'cancelado'}
        };

        const color = colors[priority] || "#2563EB";
        const statusVisual = statusMetadata[status] || statusMetadata.PENDENTE;
        const hasMultipleReports = count > 1;
        const countBadge = hasMultipleReports
            ? '<span class="complaint-marker-count">' + count + '</span>'
            : '';
        const markerHeight = 26;

        const icon = L.divIcon({
            className: "complaint-marker-icon",
            html: '<div class="complaint-marker-wrap">' +
                '<span class="complaint-marker-dot" style="background-color:' + color + '"></span>' +
                '<span class="status-marker-badge status-' + statusVisual.className + '">' +
                    statusVisual.symbol + '</span>' +
                countBadge +
                '</div>',
            iconSize: [hasMultipleReports ? 64 : 28, markerHeight],
            iconAnchor: [14, markerHeight / 2],
            popupAnchor: [12, -10]
        });

        let confirmationPanel = '';
        if (!complaintId) {
            confirmationPanel = '';
        } else if (status === 'RESOLVIDO') {
            confirmationPanel = '<div class="community-confirmation community-confirmation-status">' +
                'Relato concluído</div>';
        } else if (status === 'CANCELADO') {
            confirmationPanel = '<div class="community-confirmation">Relato cancelado</div>';
        } else {
            const buttonText = hasConfirmed ? 'Você já confirmou' : 'Confirmar que foi resolvida';
            confirmationPanel = '<div class="community-confirmation">' +
                '<button type="button" class="community-confirm-button" ' +
                (hasConfirmed ? 'disabled' : '') + '>' + buttonText + '</button>' +
                '<div>' + confirmations + ' de ' + requiredConfirmations +
                ' confirmações da comunidade</div></div>';
        }

        const marker = L.marker([lat,lng], {icon: icon})
            .addTo(complaintMarkers)
            .bindPopup(title + confirmationPanel);

        marker.on('popupopen', function(event){
            const button = event.popup.getElement().querySelector('.community-confirm-button');
            if (!button) {
                return;
            }
            L.DomEvent.disableClickPropagation(button);
            if (button.dataset.listenerAttached === 'true') {
                return;
            }
            button.dataset.listenerAttached = 'true';
            button.addEventListener('click', function(clickEvent){
                clickEvent.preventDefault();
                clickEvent.stopPropagation();
                button.disabled = true;
                button.textContent = 'Registrando...';
                if (window.javaBridge) {
                    window.javaBridge.onResolutionConfirmed(complaintId);
                }
            }, {once: true});
        });
    }

    function clearComplaintMarkers(){
        complaintMarkers.clearLayers();
    }

    let priorityLegend = null;

    function showPriorityLegend(){

        if(priorityLegend){
            return;
        }

        priorityLegend = L.control({position: "bottomright"});

        priorityLegend.onAdd = function(){
            const div = L.DomUtil.create("div", "priority-legend");
            div.innerHTML =
                "<b>Prioridade</b><br>" +
                '<span class="priority-dot" style="background:#64748B"></span>Baixa<br>' +
                '<span class="priority-dot" style="background:#2563EB"></span>Média<br>' +
                '<span class="priority-dot" style="background:#EA580C"></span>Alta<br>' +
                '<span class="priority-dot" style="background:#DC2626"></span>Urgente' +
                '<div class="legend-section-title">Situação</div>' +
                '<span class="status-legend-mark status-pendente">!</span>Pendente<br>' +
                '<span class="status-legend-mark status-em-analise">?</span>Em análise<br>' +
                '<span class="status-legend-mark status-em-execucao">↗</span>Em execução<br>' +
                '<span class="status-legend-mark status-resolvido">✓</span>Resolvido<br>' +
                '<span class="status-legend-mark status-cancelado">×</span>Cancelado';
            return div;
        };

        priorityLegend.addTo(map);
    }

    let loadingPopup = null;

    function showLoading(){

        if(loadingPopup){

            map.removeLayer(loadingPopup);

        }

        loadingPopup = L.popup({

            closeButton:false,
            autoClose:false

        })
        .setLatLng(map.getCenter())
        .setContent("Buscando endereço...")
        .openOn(map);

    }

    function hideLoading(){

        if(loadingPopup){

            map.closePopup(loadingPopup);

            loadingPopup = null;

        }

    }

    function invalidateMapSize(){
        map._sizeChanged = true;
        map.invalidateSize({pan: false, animate: false});
    }

    window.addEventListener("resize", invalidateMapSize);

    setTimeout(invalidateMapSize, 200);

</script>

</body>
