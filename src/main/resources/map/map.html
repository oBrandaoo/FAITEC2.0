<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8"/>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        html,body{
            margin:0;
            padding:0;
            height:100%;
        }

        #map{
            width:100%;
            height:100%;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    let selectedMarker = null;

    const map = L.map("map",{

        preferCanvas:true,
        zoomAnimation:false,
        fadeAnimation:false,
        markerZoomAnimation:false

    }).setView([-22.252,-45.703],13);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19
    }).addTo(map);

    map.on("click",function(e){

        if(selectedMarker){

            map.removeLayer(selectedMarker);
        }

        selectedMarker = L.marker(e.latlng).addTo(map);

        if(window.javaBridge){

            window.javaBridge.onLocationSelected(
                e.latlng.lat,
                e.latlng.lng
            );
        }
    });

    function centerMap(lat,lng){

        map.setView([lat,lng],17);
    }

    function addComplaintMarker(lat,lng,title){

        L.marker([lat,lng])
            .addTo(map)
            .bindPopup(title);
    }

    let loadingPopup = null;

    function showLoading(){

        if(loadingPopup){

            map.removeLayer(loadingPopup);

        }

        loadingPopup = L.popup({

            closeButton:false,
            autoClose:false

        })
        .setLatLng(map.getCenter())
        .setContent("Buscando endereço...")
        .openOn(map);

    }

    function hideLoading(){

        if(loadingPopup){

            map.closePopup(loadingPopup);

            loadingPopup = null;

        }

    }

    setTimeout(function(){

        map.invalidateSize();

    },200);

</script>

</body>

</html>
